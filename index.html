<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Strona startowa">
    <meta name="theme-color" content="#0ea5e9">
    <title>Strona główna</title>
    <style>
      :root { color-scheme: light dark; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        line-height: 1.5;
      }
      .container {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      header {
        border-bottom: 1px solid rgba(0,0,0,.1);
      }
      nav a { color: inherit; text-decoration: none; margin-right: 1rem; }
      nav a:focus, nav a:hover { text-decoration: underline; }
      .hero { padding: 3rem 0; }
      .hero h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 .5rem; }
      footer {
        border-top: 1px solid rgba(0,0,0,.1);
        padding: 1rem 0;
        font-size: .9rem;
        color: rgba(0,0,0,.7);
      }
      @media (prefers-color-scheme: dark) {
        header, footer { border-color: rgba(255,255,255,.15); }
        footer { color: rgba(255,255,255,.75); }
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
      }
      .skip-link:focus { left: 1rem; top: 1rem; background: #0ea5e9; color: white; padding: .5rem .75rem; border-radius: .375rem; }
    </style>
  </head>
  <body>
    <a href="#main" class="skip-link">Przejdź do treści</a>
    <header>
      <div class="container">
        <nav aria-label="Główna nawigacja">
          <a href="#">Start</a>
          <a href="#o-nas">O nas</a>
          <a href="#kontakt">Kontakt</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container">
      <section class="hero" aria-labelledby="tytul-strony">
        <h1 id="tytul-strony">Witamy!</h1>
        <p>To jest przykładowa strona startowa przygotowana zgodnie z dobrymi praktykami HTML.</p>
      </section>

      <section aria-labelledby="sekcja-funkcje">
        <h2 id="sekcja-funkcje">Co dalej?</h2>
        <ul>
          <li>Dodaj własne treści w sekcji main.</li>
          <li>Podmień tytuł i opis w meta tagach.</li>
          <li>Rozszerz nawigację o prawdziwe linki.</li>
        </ul>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>© <span id="year"></span> Twoja firma</p>
      </div>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
  </html>
